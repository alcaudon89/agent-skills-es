name: Empaquetar skills

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear un ZIP por skill
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -r "../dist/${name}.zip" "$name"
          done
      - name: Publicar en la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: ${{ github.ref_name }}
